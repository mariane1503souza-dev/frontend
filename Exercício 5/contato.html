<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Scream Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Scream Store</h1>
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span><span></span><span></span>
        </label>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Contato</h2>
        <div class="info-card">
            <form action="#">
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Seu nome..." required>
                </div>
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div>
                    <label for="assunto">Assunto:</label>
                    <input type="text" id="assunto" placeholder="Assunto da mensagem">
                </div>
                <div>
                    <label for="msg">Mensagem:</label>
                    <textarea id="msg" rows="5" placeholder="Qual seu filme de terror favorito?" required></textarea>
                </div>
                <button type="submit" class="btn">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Scream Store - Não atenda o telefone.</p>
    </footer>
</body>
</html>
