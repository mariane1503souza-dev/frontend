<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pânico 7 - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-danger">
        <div class="container">
            <a class="navbar-brand text-danger" href="index.html" style="font-family: 'Nosifer', cursive;">PÂNICO 7</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link active" href="cadastro.html">Cadastro</a></li>
                    <li class="nav-item"><a class="nav-link" href="lista.html">Lista</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-black border-danger text-light shadow-lg">
                    <div class="card-header border-danger">
                        <h2 class="text-center text-danger" style="font-family: 'Creepster', cursive; font-size: 2.5rem;">Cadastrar Item</h2>
                    </div>
                    <div class="card-body">
                        <form id="productForm">
                            <div class="mb-3">
                                <label for="productName" class="form-label">Nome do Produto</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary" id="productName" required>
                            </div>
                            <div class="mb-3">
                                <label for="productCategory" class="form-label">Categoria</label>
                                <select class="form-select bg-dark text-light border-secondary" id="productCategory" required>
                                    <option value="" selected disabled>Escolha...</option>
                                    <option value="Armas">Armas de Defesa</option>
                                    <option value="Vestuário">Vestuário / Máscaras</option>
                                    <option value="Colecionáveis">Colecionáveis</option>
                                    <option value="Eletrônicos">Telefones / Gravadores</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="productPrice" class="form-label">Preço (R$ )</label>
                                <input type="number" step="0.01" class="form-control bg-dark text-light border-secondary" id="productPrice" required>
                            </div>
                            <div class="mb-3">
                                <label for="productDesc" class="form-label">Descrição Sangrenta</label>
                                <textarea class="form-control bg-dark text-light border-secondary" id="productDesc" rows="3"></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-danger">SALVAR NO INVENTÁRIO</button>
                            </div>
                        </form>
                        <div id="message" class="mt-3 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
