<!-- ... dentro do card-body ... -->
<form id="formCadastro">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome do Produto</label>
        <input type="text" class="form-control bg-dark text-light border-secondary" id="nome" required>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="categoria" class="form-label">Categoria</label>
            <select class="form-select bg-dark text-light border-secondary" id="categoria" required>
                <option value="Armas">Armas</option>
                <option value="Vestuário">Vestuário</option>
                <!-- outras opções -->
            </select>
        </div>
        <div class="col-md-6">
            <label for="preco" class="form-label">Preço (R$)</label>
            <input type="number" step="0.01" class="form-control bg-dark text-light border-secondary" id="preco" required>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="estoque" class="form-label">Qtd. em Estoque</label>
            <input type="number" class="form-control bg-dark text-light border-secondary" id="estoque" required>
        </div>
        <div class="col-md-6">
            <label for="status" class="form-label">Status</label>
            <select class="form-select bg-dark text-light border-secondary" id="status" required>
                <option value="Disponível">Disponível</option>
                <option value="Esgotado">Esgotado</option>
                <option value="Em Reserva">Em Reserva</option>
            </select>
        </div>
    </div>
    <button type="submit" class="btn btn-danger w-100">CADASTRAR NO ARQUIVO</button>
</form>
<div id="feedback" class="mt-3 text-center"></div>
